# Publishes the web/ folder to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to publish if student data is present
        run: |
          python3 - <<'PY'
          import json, sys
          allowed = {"id", "name", "city", "state", "stateName", "country", "countryName", "region",
                     "type", "lat", "lon", "logo", "website", "total", "byYear"}
          data = json.load(open("web/data/matriculation.json"))
          for s in data["schools"]:
              extra = set(s) - allowed
              if extra:
                  sys.exit(f"Unexpected fields {extra} in web/data/matriculation.json; aborting.")
          print(f"OK: {len(data['schools'])} schools, aggregate fields only")
          PY
          if ls data/raw/*.xlsx data/raw/*.csv data/raw/*.numbers 2>/dev/null | grep -q .; then
            echo "Raw export committed; aborting." && exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
